# h3 studio's manifest for helmstudio: the same studio the registry points at,
# described by its own repository, beside the code it runs. The registry entry
# keeps the pointer — id, repo and ref — and no longer needs a copy of this.
id: h3-studio
name: h3 studio
description: Native Metal video and audio generation from MiniMax-H3, no PyTorch in the loop.
kinds: [video, audio]
# helmstudio 03 §2's identity hue for this studio, chosen against its yellow accent.
hue: { dark: "#e0a33c", light: "#a06a10" }
license: MIT
repo: https://github.com/janishar/h3c-studio
submodules: true
peak_ram_gb: 21
requires:
  os: [darwin]
  arch: [arm64]
  tools: [git, make, cc, go, ffmpeg]
  ram_gb: 64
  disk_gb: 200
runtime:
  framework: native-kernel
  backends: [metal]
  precision: [bf16, int8]
  language: c
# What h3 studio actually uses, and no more (criterion 9): a finished take is
# adopted as an asset and recorded as one gallery item, so what this studio
# made is in the gallery every studio shares. Nothing else yet — sessions stay
# its own directories, so kv, records and timeline are not requested and the
# gallery item carries no session_id.
capabilities: [assets, gallery, timeline]
# The page loads helm-ui for the shared gallery; it still draws its own takes
# rail, viewer and timeline, so this pins what it loads and nothing else.
sdk: { runtime: "^1", ui: "^1", css: "^1" }
# Contacted at build or run time, which is what the field means and what the
# approval screen shows. The Go proxy and the checksum database are here
# because `go build` resolves helm-runtime-sdk through them; Hugging Face is
# where the weights come from.
network: [huggingface.co, cdn-lfs.huggingface.co, proxy.golang.org, sum.golang.org]
build:
  - name: Build the Metal engine
    cwd: h3c
    run: make -j8
  - name: Build the studio server
    cwd: .
    run: go build -o dist/h3studio .
# FL2VA and Ref2VA are two pipelines inside one MiniMaxAI/MiniMax-H3 repo, both
# expected as subdirectories of the single directory --model points at
# (server/model.go). Both share dest so {models.fl2va} and {models.ref2va}
# resolve to the same directory; files scopes each to its own subtree.
weights:
  - name: fl2va
    repo: MiniMaxAI/MiniMax-H3
    dest: MiniMax-H3
    files: ["FL2VA/**"]
    size_gb: 62
  - name: ref2va
    repo: MiniMaxAI/MiniMax-H3
    dest: MiniMax-H3
    files: ["Ref2VA/**"]
    size_gb: 134
    optional: true
processes:
  - name: studio
    role: main
    heavy: true
    cmd: "./dist/h3studio --h3 ./h3c/h3 --model {models.fl2va} --port {port} --root {data}"
    port: { prefer: 8710 }
    health: { tcp: true, timeout_s: 30, interval_s: 2 }
    # /api/queue does not answer the busy contract yet, so the switch dialog
    # reads h3 as unknown until it does.
    busy: { path: /api/queue }
    ui: /
